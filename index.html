<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@401&display=swap"
        rel="stylesheet">
    <title>GTA</title>
</head>

<body>
    <p class="nome">Lucia</p>

    <img class="personagem" src="img/lucia.png" alt="Imagem da Lucia">

    <div class="textos">
        <p class="etiqueta">Selecione o seu Personagem</p>
        <h1>Não é só<br>um Jogo</h1>
        <p class="texto-apoio">Escolha uma lenda de Dev City, ou tire uma self e vire uma</p>
    </div>


    <div class="menu">

            <img onclick="escolherPersonagem('Lucia', 'img/lucia.png', '#ff3cac' )" class="avatar" src="/img/lucia.png" alt="Imagem da Lucia">
            <img onclick="escolherPersonagem('Jason', 'img/jason.png', '#00b2c9')" class="avatar" src="/img/jason.png" alt="Imagem do Jason">
            <img onclick="escolherPersonagem('CJ', 'img/cj.png', '#7ed37e')" class="avatar" src="img/cj.png" alt="Imagem do CJ">

        <button class="voce">📸</button>
    </div>

</body>

<script src="script.js"></script>

</html>
